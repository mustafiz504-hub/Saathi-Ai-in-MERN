
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }
  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-4px); }
  }
  @keyframes scanScroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(8px); }
  }
  @keyframes pulse-glow {
    0%,100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .float-anim { animation: float 3.8s ease-in-out infinite; }
  .emotion-btn {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    cursor: pointer;
    padding: 10px 6px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: all 200ms ease;
    position: relative;
  }
  .emotion-btn:hover { background: rgba(0,229,204,0.07); border-color: rgba(0,229,204,0.3); }
  .emotion-btn.active { background: rgba(0,229,204,0.12); border-color: #00E5CC; }
  .emotion-btn canvas { display: block; }
  .size-btn {
    padding: 4px 14px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent;
    color: #8AACB2;
    cursor: pointer;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 1px;
    transition: all 200ms;
  }
  .size-btn.active { border-color: #00E5CC; background: rgba(0,229,204,0.12); color: #00E5CC; }
</style>

<div style="min-height:580px; background:#0D1114; padding:32px 20px 28px; display:flex; flex-direction:column; align-items:center; gap:28px; font-family:'IBM Plex Mono',monospace;">
  <h2 class="sr-only">Nemo AI Companion — Robot Eye Expression System</h2>

  <!-- Title -->
  <div style="text-align:center;">
    <div style="font-size:10px;letter-spacing:4px;color:#00E5CC;margin-bottom:6px;opacity:0.8;">NEMO AI COMPANION</div>
    <div style="font-size:22px;font-weight:300;letter-spacing:1px;color:#E8F4F6;">Eye Expression System</div>
  </div>

  <!-- Main stage -->
  <div style="display:flex;align-items:center;gap:36px;flex-wrap:wrap;justify-content:center;">
    <div id="main-stage" style="position:relative;flex-shrink:0;">
      <canvas id="main-canvas" width="180" height="180" style="display:block;border-radius:40px;"></canvas>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="font-size:9px;letter-spacing:3px;color:#00E5CC;">EMOTION</div>
      <div id="emotion-label" style="font-size:20px;font-weight:400;color:#E8F4F6;border-left:2px solid #00E5CC;padding-left:12px;min-width:140px;transition:all 300ms;">neutral</div>
      <div style="font-size:9px;letter-spacing:3px;color:#00E5CC;margin-top:12px;">SIZE</div>
      <div style="display:flex;gap:8px;">
        <button class="size-btn active" data-size="sm" onclick="setSize('sm')">sm</button>
        <button class="size-btn active" data-size="md" onclick="setSize('md')">md</button>
        <button class="size-btn" data-size="lg" onclick="setSize('lg')">lg</button>
      </div>
      <div id="code-preview" style="margin-top:14px;border-radius:8px;border:1px solid rgba(0,229,204,0.15);background:rgba(0,229,204,0.04);padding:10px 14px;font-size:11px;color:#607880;line-height:1.9;max-width:230px;"></div>
    </div>
  </div>

  <!-- Grid -->
  <div style="width:100%;max-width:680px;">
    <div style="font-size:9px;letter-spacing:3px;color:#00E5CC;margin-bottom:14px;text-align:center;">SELECT EXPRESSION</div>
    <div id="emotion-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;"></div>
  </div>
</div>

<script>
const CYAN = '#00E5CC';
const SCREEN_BG = '#0A0E0F';
const LOVE_COLOR = '#FF5098';

const EMOTIONS = {
  neutral:   { l:{},               r:{} },
  happy:     { l:{shape:'hbot'},   r:{shape:'hbot'},     glow:'rgba(0,229,204,0.6)' },
  glee:      { l:{shape:'hbot',sy:1.3,ty:-3}, r:{shape:'hbot',sy:1.3,ty:-3}, glow:'rgba(0,229,204,0.7)', pd:{dy:-4,s:1.1} },
  sad:       { l:{shape:'htop',rot:-8,sy:0.85}, r:{shape:'htop',rot:8,sy:0.85}, pd:{dy:3,s:0.9} },
  worried:   { l:{rot:14,sy:0.82}, r:{rot:-14,sy:0.82},  pd:{dy:2,s:0.85} },
  angry:     { l:{shape:'htop',rot:-22,sy:0.65}, r:{shape:'htop',rot:22,sy:0.65}, glow:'rgba(255,60,30,0.5)', pd:{dy:3,s:0.7} },
  furious:   { l:{shape:'htop',rot:-32,sy:0.5,ty:4}, r:{shape:'htop',rot:32,sy:0.5,ty:4}, glow:'rgba(255,40,10,0.55)', pd:{dy:5,s:0.65} },
  surprised: { l:{sy:1.35,rx:11},  r:{sy:1.35,rx:11},   pd:{s:1.2} },
  sleepy:    { l:{sy:0.35,ty:9},   r:{sy:0.35,ty:9},    pd:{dy:6,s:0.55} },
  focused:   { l:{sy:0.75,rx:3},   r:{sy:0.75,rx:3},    glow:'rgba(0,229,204,0.55)', pd:{s:1.05} },
  confused:  { l:{rot:16,sy:0.88}, r:{sy:1.12,rot:0},   pd:{dx:3,s:0.9} },
  love:      { l:{shape:'heart'},  r:{shape:'heart'},    glow:'rgba(255,80,140,0.55)' },
  suspicious:{ l:{sy:0.45,ty:7,rot:-6}, r:{sy:0.82,rot:0}, pd:{dx:-4,dy:3,s:0.8} },
  skeptic:   { l:{sy:0.6,rot:6},   r:{sy:0.6,rot:-6},   pd:{s:0.82} },
  awe:       { l:{sy:1.4,rx:13},   r:{sy:1.4,rx:13},    glow:'rgba(0,229,204,0.65)', pd:{dy:-2,s:1.3} },
  scared:    { l:{sy:1.2,ty:-4,rx:11},r:{sy:1.2,ty:-4,rx:11}, glow:'rgba(120,80,255,0.5)', pd:{dx:-3,dy:-2,s:0.68} },
};

// State
let currentEmotion = 'neutral';
let currentSize = 'md';
let isBlinking = false;
let floatT = 0;
let blinkTimer = null;
let animFrame = null;
let thumbCanvases = {};

const SIZES = {
  sm: { face:88,  ew:22, eh:16, gap:10, pr:5,  br:18 },
  md: { face:180, ew:48, eh:35, gap:20, pr:10, br:40 },
  lg: { face:240, ew:64, eh:48, gap:28, pr:14, br:52 },
};

function drawEye(ctx, cx, cy, w, h, cfg, isBlinking, floatY, alpha=1) {
  const { shape, sy=1, ty=0, rot=0, rx=6 } = cfg;
  const finalSY = isBlinking ? 0.06 : sy;
  const finalTY = isBlinking ? cy * 0.9 : ty;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy + floatY);
  ctx.rotate(rot * Math.PI/180);
  ctx.scale(1, finalSY);
  ctx.translate(0, finalTY / finalSY);

  const ew2 = w/2, eh2 = h/2;

  if (shape === 'heart') {
    ctx.beginPath();
    const s = Math.min(w,h)*0.8;
    ctx.moveTo(0, s*0.28);
    ctx.bezierCurveTo(0,-s*0.08, -s*0.55,-s*0.42, -s*0.5,-s*0.12);
    ctx.bezierCurveTo(-s*0.55,-s*0.52, -s*0.02,-s*0.52, 0,-s*0.08);
    ctx.bezierCurveTo(s*0.02,-s*0.52, s*0.55,-s*0.52, s*0.5,-s*0.12);
    ctx.bezierCurveTo(s*0.55,-s*0.42, 0,-s*0.08, 0, s*0.28);
    ctx.closePath();
    ctx.fillStyle = LOVE_COLOR;
    ctx.fill();
    ctx.restore();
    return;
  }

  ctx.beginPath();
  roundRect(ctx, -ew2, -eh2, w, h, rx);
  if (shape === 'hbot') {
    ctx.save();
    ctx.clip();
    ctx.fillStyle = CYAN;
    ctx.fillRect(-ew2, -eh2, w, eh2);
    ctx.restore();
  } else if (shape === 'htop') {
    ctx.save();
    ctx.clip();
    ctx.fillStyle = CYAN;
    ctx.fillRect(-ew2, 0, w, eh2);
    ctx.restore();
  } else {
    ctx.fillStyle = CYAN;
    ctx.fill();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function drawFace(canvas, emotion, sz, blink, floatY) {
  const s = SIZES[sz];
  canvas.width = s.face;
  canvas.height = s.face;
  const ctx = canvas.getContext('2d');
  const cfg = EMOTIONS[emotion] || EMOTIONS.neutral;
  const glow = cfg.glow || 'rgba(0,229,204,0.22)';

  // Face background
  const rg = ctx.createRadialGradient(s.face/2, s.face*0.4, 0, s.face/2, s.face/2, s.face*0.7);
  rg.addColorStop(0, '#141C1E');
  rg.addColorStop(1, SCREEN_BG);
  ctx.save();
  ctx.beginPath();
  roundRect(ctx, 0, 0, s.face, s.face, s.br);
  ctx.closePath();
  ctx.fillStyle = rg;
  ctx.fill();

  // Outer glow ring
  ctx.shadowColor = glow;
  ctx.shadowBlur = 28;
  ctx.strokeStyle = glow.replace(/[\d.]+\)$/, '0.4)');
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  // Scan lines
  ctx.save();
  ctx.beginPath();
  roundRect(ctx, 0, 0, s.face, s.face, s.br);
  ctx.clip();
  ctx.globalAlpha = 0.045;
  for(let i=0; i<s.face; i+=4) {
    ctx.fillStyle = CYAN;
    ctx.fillRect(0, i, s.face, 0.8);
  }
  ctx.globalAlpha = 1;
  // Top sheen
  const sg = ctx.createLinearGradient(0,0,0,s.face*0.45);
  sg.addColorStop(0,'rgba(255,255,255,0.055)');
  sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, s.face, s.face*0.45);
  ctx.restore();

  // Eyes
  const eyeY = s.face * 0.5;
  const lx = s.face/2 - s.gap/2 - s.ew/2;
  const rx2 = s.face/2 + s.gap/2 + s.ew/2;

  // Glow behind eyes
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 18;
  drawEye(ctx, lx, eyeY, s.ew, s.eh, cfg.l, blink, floatY);
  drawEye(ctx, rx2, eyeY, s.ew, s.eh, cfg.r, blink, floatY);
  ctx.restore();

  // Eyes main
  ctx.save();
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 10;
  drawEye(ctx, lx, eyeY, s.ew, s.eh, cfg.l, blink, floatY);
  drawEye(ctx, rx2, eyeY, s.ew, s.eh, cfg.r, blink, floatY);
  ctx.restore();

  // Specular highlights
  if (!blink) {
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = 'white';
    const highlightEl = (ex) => {
      ctx.beginPath();
      ctx.ellipse(ex - s.ew*0.15, eyeY + floatY - s.eh*0.25, s.ew*0.1, s.eh*0.08, 0, 0, Math.PI*2);
      ctx.fill();
    };
    highlightEl(lx);
    highlightEl(rx2);
    ctx.restore();
  }
}

function drawThumb(canvas, emotion) {
  const s = SIZES['sm'];
  canvas.width = s.face;
  canvas.height = s.face;
  const ctx = canvas.getContext('2d');
  const cfg = EMOTIONS[emotion] || EMOTIONS.neutral;

  ctx.save();
  ctx.beginPath();
  roundRect(ctx, 0, 0, s.face, s.face, s.br);
  ctx.fillStyle = '#0D1417';
  ctx.fill();
  ctx.restore();

  const lx = s.face/2 - s.gap/2 - s.ew/2;
  const rx2 = s.face/2 + s.gap/2 + s.ew/2;
  ctx.save();
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 6;
  drawEye(ctx, lx, s.face*0.5, s.ew, s.eh, cfg.l, false, 0);
  drawEye(ctx, rx2, s.face*0.5, s.ew, s.eh, cfg.r, false, 0);
  ctx.restore();
}

function setEmotion(em) {
  currentEmotion = em;
  document.querySelectorAll('.emotion-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.emotion === em);
  });
  document.getElementById('emotion-label').textContent = em;
  updateCodePreview();
}

function setSize(sz) {
  currentSize = sz;
  document.querySelectorAll('.size-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.size === sz);
  });
  const canvas = document.getElementById('main-canvas');
  canvas.style.borderRadius = SIZES[sz].br + 'px';
  updateCodePreview();
}

function updateCodePreview() {
  document.getElementById('code-preview').innerHTML =
    `<span style="color:#00E5CC">&lt;NemoEyes</span><br>` +
    `&nbsp;emotion=<span style="color:#FFB347">"${currentEmotion}"</span><br>` +
    `&nbsp;size=<span style="color:#FFB347">"${currentSize}"</span><br>` +
    `<span style="color:#00E5CC">/&gt;</span>`;
}

function scheduleBlink() {
  const delay = 3800 + Math.random() * 3000;
  clearTimeout(blinkTimer);
  blinkTimer = setTimeout(() => {
    isBlinking = true;
    setTimeout(() => { isBlinking = false; scheduleBlink(); }, 170);
  }, delay);
}

function loop() {
  floatT += 0.013;
  const fy = Math.sin(floatT) * 3.5;
  const canvas = document.getElementById('main-canvas');
  if (canvas) drawFace(canvas, currentEmotion, currentSize, isBlinking, fy);
  animFrame = requestAnimationFrame(loop);
}

// Build grid
const grid = document.getElementById('emotion-grid');
Object.keys(EMOTIONS).forEach(em => {
  const btn = document.createElement('button');
  btn.className = 'emotion-btn' + (em === 'neutral' ? ' active' : '');
  btn.dataset.emotion = em;
  btn.onclick = () => setEmotion(em);

  const cvs = document.createElement('canvas');
  cvs.style.borderRadius = SIZES.sm.br + 'px';
  btn.appendChild(cvs);
  drawThumb(cvs, em);

  const lbl = document.createElement('span');
  lbl.textContent = em;
  lbl.style.cssText = 'font-size:8px;color:#607880;letter-spacing:1px;text-transform:uppercase;font-family:IBM Plex Mono,monospace;';
  btn.appendChild(lbl);

  grid.appendChild(btn);
});

// Size buttons dataset
document.querySelectorAll('.size-btn').forEach(b => {
  b.classList.toggle('active', b.dataset.size === currentSize);
});
document.querySelector('[data-size="md"]').classList.add('active');
document.querySelector('[data-size="sm"]').classList.remove('active');

setSize('md');
updateCodePreview();
scheduleBlink();
loop();
</script>
